name: Rebuildable

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Audit reproducibility
        run: go run ./cmd/rebuildable audit . --min-score 8
      - name: Run unit tests
        run: make test
      - name: Run lint
        run: make lint
      - name: Run Docker integration tests
        run: make test-integration
      - name: Build self-auditing image
        run: docker build --tag rebuildable:ci .
      - name: Smoke test self-auditing image
        run: docker run --rm rebuildable:ci

  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: reproducibility
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release artifacts
        run: VERSION="${GITHUB_REF_NAME#v}" make release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
